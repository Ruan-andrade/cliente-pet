server:
  port: 8080
  servlet:
    context-path: /cliente-pet/api
spring:
  datasource:
    url: jdbc:h2:tcp://localhost:8080/default
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
